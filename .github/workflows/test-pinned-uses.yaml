name: test-pinned-uses

# Self-test for the reusable pinned-uses.yaml.
#
#   - cases: runs the workflow's own check step against generated workflow files: pinned with a version,
#     pinned with a dated comment, quoted, local, an action, a branch, a tag, an abbreviated SHA, no
#     comment, a non-version comment, one bad file among good ones, and no workflow files at all; and
#     for `secrets: inherit`: cross-org (plain, with a trailing comment, before `uses:`, quoted) is
#     refused; same-org, named secrets, a mention in a comment, a commented-out key, an inherit in
#     another job and a nested `secrets:` key pass; an empty caller fails; and for a recorded float
#     (`# floating: <reason>`): a branch with a reason passes and is printed with it; an empty or blank
#     reason, a float on a SHA pin, a float of the publisher, and a float of a tag, a v-tag or an
#     abbreviated SHA are refused. Then it deletes each marked block (sha-check, comment-check,
#     inherit-check, floating-check, float-reason, float-sha, float-publisher, float-branch) and
#     requires each case that block exists for to flip its verdict, so each case is shown to test what
#     it claims to, and every block has at least one such case. Last, it swaps inherit-check for a
#     plain text search and requires that to refuse the mention cases, which it did to real callers.
#   - this-repository: a real call through `uses:`, on this repository's own workflows, which rule 9
#     covers like any caller's.

on:
  pull_request:
    paths:
      - .github/workflows/**
      - test/pinned-uses/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - test/pinned-uses/**

permissions:
  contents: read

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every case gets the verdict it should, and each check block is what decides it
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet "pyyaml==6.0.2"
          /tmp/venv/bin/python test/pinned-uses/run-cases.py

  this-repository:
    uses: ./.github/workflows/pinned-uses.yaml
