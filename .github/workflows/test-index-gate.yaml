name: test-index-gate

# Self-test for the index-gate action (.github/actions/index-gate): publish-chart.yaml pins it by commit, and
# that commit's gate.sh must be this commit's (test/index-gate/run-identity.py), so the gate the index runs is
# the gate test-publish-chart.yaml's content-gate job tests. Needs the full history, hence fetch-depth 0.

on:
  pull_request:
    paths:
      - .github/actions/index-gate/**
      - .github/workflows/publish-chart.yaml
      - .github/workflows/test-index-gate.yaml
      - test/index-gate/**
  push:
    branches:
      - main
    paths:
      - .github/actions/index-gate/**
      - .github/workflows/publish-chart.yaml
      - .github/workflows/test-index-gate.yaml
      - test/index-gate/**

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: publish-chart's pinned gate.sh is this commit's
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet "pyyaml==6.0.2"
          /tmp/venv/bin/python -I test/index-gate/run-identity.py .
