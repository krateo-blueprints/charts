name: pinned-uses

# Every reusable workflow a repository calls is pinned by full commit SHA with a version comment
# (PUBLISHING.md rule 9). A caller adds this as a job of its lint, pinned the same way.
#
# A movable ref (`@main`, a tag such as `@1.1.0`) lets whoever moves it run code in every caller at
# once, with whatever the caller passes or grants it. It also lets a caller's CI change behaviour
# without a commit in the caller, so a green run can't be reproduced. On 2026-11-18, 136 reusable
# `uses:` across 51 krateo-blueprints repositories were movable, the publisher itself @main in 12
# (krateo-blueprints/charts#20).
#
# What is checked: every `uses:` in the caller's .github/workflows/*.y*ml whose target is another
# repository's reusable workflow (`owner/repo/.github/workflows/<file>@<ref>`). It must have:
#   - a ref of exactly 40 lowercase hex characters, a commit. A tag or branch can move. An abbreviated
#     SHA is refused by GitHub for reusable workflows anyway.
#   - a trailing comment naming what that commit is: `# X.Y.Z` (the tag it carries), or, for a
#     repository that publishes no tags yet (krateo-platformops/.github), `# main YYYY-MM-DD`, the
#     date of the main commit pinned. Without the comment nobody can tell what is pinned or
#     whether it is stale. The dated form is transitional: krateo-platformops/.github will tag its
#     workflows (charts#23), and callers then move to `# X.Y.Z`.
# The one exception is a deliberate float, recorded at the line where it happens:
#     uses: owner/repo/.github/workflows/x.yaml@main # floating: YYYY-MM-DD <reason>
# It is a first-class form of the comment check, beside `# X.Y.Z` and `# main YYYY-MM-DD`, and is
# accepted only when every claim the check can verify holds:
#   - the date is a real calendar date, so a float's age is visible;
#   - there is a reason: inline after the date or, when the line has none, the comment block
#     immediately above the `uses:` line, inside the same job with no blank line between (for a
#     rationale too long for one line);
#   - the reusable's owner is org-owned (krateo-platformops or krateo-blueprints); another owner's
#     code is never floated;
#   - it is not the publisher (krateo-blueprints/charts publish-chart.yaml), which receives an
#     org-wide write token and stays pinned;
#   - the ref is a branch. `floating` on a 40-hex pin is refused as meaningless. A ref that looks
#     like a version (`1`, `1.1.0`, `v7`) or is 7 to 39 hex characters is read as a tag or an
#     abbreviated SHA and refused; the check makes no network call, so a branch named like either is
#     refused, not guessed at.
# Every accepted float is printed with its file, line, date and reason, and the summary line always
# counts floats next to the unpinned and the cross-org inherits, so a lazy float is visible, not
# hidden behind a green "0 not pinned".
# (Decided by Diego for nova-kog, 2026-11-07, reaffirmed 2026-11-18: org-owned workflows may float
# where a repository chooses to; the publisher may not.)
# What is not checked: local workflows (`./...`), which move with the caller's own commit;
# `docker://` images; and actions (`owner/repo@ref`, no .github/workflows/ in the path). Rule 9 does
# not cover actions (charts#20, decided 2026-11-18).
#
# A repository with no workflow file at all fails: a check that read nothing has checked nothing.
#
# Also checked, on the same `uses:`: no `secrets: inherit` when the reusable's owner is not the
# caller's owner. `inherit` passes nothing to a reusable in another organisation, and nothing says so:
# the called workflow reads every secret as '' and decides for itself what that means.
# krateo-platformops/.github's release-notes.yaml reads it as "no credential is set for this org",
# skips every step and reports success. openstack-keystone-operator-kog shipped 0.4.1 and 0.4.2 that
# way (release-notes runs 43481711323 and 44232413718) while the org secret was set, until its caller
# passed the secrets by name (openstack-keystone-operator-kog#33, krateo-platformops/.github#57). Only
# the uncommented key counts: callers that were fixed explain the fix in a comment that quotes
# `secrets: inherit`, and a text search counted all 44 krateo-blueprints callers of release-notes.yaml
# as inheriting when one did. The caller's owner comes from github.repository; if it is empty the
# check fails rather than skipping.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "directory, relative to the repository root, whose .github/workflows/ is checked (default: the root)"
        type: string
        required: false
        default: "."

jobs:
  pinned-uses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The directory reaches the script through env, never interpolated into it.
      - name: Every reusable workflow is pinned by commit SHA with a version comment, and gets no cross-org secrets inherit
        env:
          WORKDIR: ${{ inputs.working-directory }}
          CALLER: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "${WORKDIR}"
          python3 -I - <<'PY'
          import datetime
          import glob
          import os
          import re
          import sys

          files = sorted(glob.glob(".github/workflows/*.yaml") + glob.glob(".github/workflows/*.yml"))
          if not files:
              print("::error::no .github/workflows/*.yaml or *.yml here, so nothing was checked")
              sys.exit(1)
          caller_owner = os.environ.get("CALLER", "").partition("/")[0].lower()
          if not caller_owner:
              print("::error::CALLER (github.repository) is empty, so a cross-org `secrets: inherit` could not be told from a same-org one")
              sys.exit(1)
          USES = re.compile(r"""^\s*(?:-\s+)?uses:\s*(['"]?)([^'"\s#]+)\1\s*(?:#\s*(.*?))?\s*$""")
          # The key itself, never a comment that quotes it: a line whose first non-blank is `#` cannot match.
          INHERIT = re.compile(r"""^(\s*)secrets:\s*(['"]?)inherit\2\s*(?:#.*)?$""")


          def indent(line):
              return len(line) - len(line.lstrip(" "))


          def significant(line):
              t = line.strip()
              return t != "" and not t.startswith("#")


          def job_siblings(lines, i):
              # The other keys of the job whose `uses:` is lines[i]: lines at the same column, inside the
              # run of significant lines indented at least that far around it.
              col = indent(lines[i])
              lo = i
              while lo > 0 and (not significant(lines[lo - 1]) or indent(lines[lo - 1]) >= col):
                  lo -= 1
              hi = i
              while hi + 1 < len(lines) and (not significant(lines[hi + 1]) or indent(lines[hi + 1]) >= col):
                  hi += 1
              return [k for k in range(lo, hi + 1) if k != i and significant(lines[k]) and indent(lines[k]) == col]

          def real_date(text):
              if not DATE.match(text):
                  return False
              try:
                  datetime.date.fromisoformat(text)
              except ValueError:
                  return False
              return True


          def reason_above(lines, i):
              # The comment block immediately above lines[i], in the same job: contiguous comment lines,
              # no blank line between, indented at least as far as the `uses:` key.
              col = indent(lines[i])
              texts = []
              k = i - 1
              while k >= 0 and lines[k].strip().startswith("#") and indent(lines[k]) >= col:
                  texts.append(lines[k].strip().lstrip("#").strip())
                  k -= 1
              return " ".join(t for t in reversed(texts) if t)

          SHA = re.compile(r"^[0-9a-f]{40}$")
          COMMENT = re.compile(r"^(\d+\.\d+\.\d+|main \d{4}-\d{2}-\d{2})$")
          # `floating:`, then the date token, then an optional inline reason.
          FLOATING = re.compile(r"^floating:\s*(\S*)\s*(.*)$")
          DATE = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          FLOAT_OWNERS = ("krateo-platformops", "krateo-blueprints")
          TAGLIKE = re.compile(r"^v?\d+(\.\d+)*([-+][0-9A-Za-z.-]+)?$")
          SHORT_SHA = re.compile(r"^[0-9a-f]{7,39}$")
          PUBLISHER = "krateo-blueprints/charts/.github/workflows/publish-chart.yaml"
          bad, inherits, floats, checked = [], [], [], 0
          for path in files:
              lines = open(path, encoding="utf-8").read().split("\n")
              for n, line in enumerate(lines, 1):
                  m = USES.match(line)
                  if not m:
                      continue
                  target, comment = m.group(2), (m.group(3) or "").strip()
                  if target.startswith(("./", "docker://")) or "/.github/workflows/" not in target:
                      continue
                  checked += 1
                  ref = target.rpartition("@")[2] if "@" in target else ""
                  where = "%s:%d: %s" % (path, n, target)
                  owner = target.split("/", 1)[0].lower()
                  # BEGIN inherit-check (test/pinned-uses/run-cases.py deletes this block to prove its cases see it)
                  if owner != caller_owner:
                      for k in job_siblings(lines, n - 1):
                          if INHERIT.match(lines[k]):
                              inherits.append("%s:%d: `secrets: inherit` for %s, a reusable owned by %s, not %s: inherit passes nothing across organisations, so pass each secret by name under `secrets:`" % (path, k + 1, target, owner, caller_owner))
                  # END inherit-check
                  float_form = FLOATING.match(comment)
                  # BEGIN comment-check
                  if not (COMMENT.match(comment)
                          # BEGIN float-form (the float is a first-class comment form; without it a valid float is a format error)
                          or float_form
                          # END float-form
                          ):
                      bad.append("%s has comment %r; it needs `# X.Y.Z`, or `# main YYYY-MM-DD` for an untagged repository (transitional), or a recorded float `# floating: YYYY-MM-DD <reason>`" % (where, comment))
                      continue
                  # END comment-check
                  # BEGIN float-accept (deleting it must turn the accepted floats into refusals)
                  if float_form:
                      date, reason = float_form.group(1), float_form.group(2).strip()
                      # BEGIN float-date
                      if not real_date(date):
                          bad.append("%s floats with %r where the date belongs; write `# floating: YYYY-MM-DD <reason>` with a real date" % (where, date))
                          continue
                      # END float-date
                      if not reason:
                          reason = reason_above(lines, n - 1)
                      # BEGIN float-reason
                      if not reason:
                          bad.append("%s floats with no reason: none after the date, and no comment block immediately above the `uses:` line" % where)
                          continue
                      # END float-reason
                      # BEGIN float-owner
                      if owner not in FLOAT_OWNERS:
                          bad.append("%s floats a reusable owned by %s; only org-owned reusables (%s) may float" % (where, owner, ", ".join(FLOAT_OWNERS)))
                          continue
                      # END float-owner
                      # BEGIN float-publisher
                      if target.rpartition("@")[0].lower() == PUBLISHER:
                          bad.append("%s floats the publisher, which receives an org-wide write token and is always pinned by commit SHA (PUBLISHING.md rule 9)" % where)
                          continue
                      # END float-publisher
                      # BEGIN float-sha
                      if SHA.match(ref):
                          bad.append("%s is pinned to a commit and also says `# floating`, which is meaningless; keep the pin and use `# X.Y.Z` or `# main YYYY-MM-DD`" % where)
                          continue
                      # END float-sha
                      # BEGIN float-branch
                      if not ref or TAGLIKE.match(ref) or SHORT_SHA.match(ref):
                          bad.append("%s floats %r, which reads as a tag or an abbreviated SHA, not a branch; only a branch ref can be a recorded float" % (where, ref))
                          continue
                      # END float-branch
                      floats.append((where, date, reason))
                      continue
                  # END float-accept
                  # BEGIN sha-check (test/pinned-uses/run-cases.py deletes this block to prove its cases see it)
                  if not SHA.match(ref):
                      bad.append("%s is pinned to %r, not a 40-hex commit SHA (a deliberate float of a branch says `# floating: YYYY-MM-DD <reason>`)" % (where, ref))
                  # END sha-check
          for where, date, reason in floats:
              print("::notice title=floating reusable workflow::%s floats since %s, reason: %s" % (where, date, reason))
          for b in bad + inherits:
              print("::error::" + b)
          print("%d file(s), %d reusable-workflow uses, %d not pinned (PUBLISHING.md rule 9), %d floating, %d cross-org secrets inherit" % (len(files), checked, len(bad), len(floats), len(inherits)))
          sys.exit(1 if bad or inherits else 0)
          PY
