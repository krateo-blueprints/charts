name: pinned-uses

# Every reusable workflow a repository calls is pinned by full commit SHA with a version comment
# (PUBLISHING.md rule 9), and so is the shared chart-push action, and no chart is pushed bare
# (rule 14). A caller adds this as a job of its lint, pinned the same way.
#
# A movable ref (`@main`, a tag such as `@1.1.0`) lets whoever moves it run code in every caller at
# once, with whatever the caller passes or grants it. It also lets a caller's CI change behaviour
# without a commit in the caller, so a green run can't be reproduced. On 2026-11-18, 136 reusable
# `uses:` across 51 krateo-blueprints repositories were movable, the publisher itself @main in 12
# (krateo-blueprints/charts#20).
#
# What is checked: every `uses:` in the caller's .github/workflows/*.y*ml whose target is another
# repository's reusable workflow (`owner/repo/.github/workflows/<file>@<ref>`). It must have:
#   - a ref of exactly 40 lowercase hex characters, a commit. A tag or branch can move. An abbreviated
#     SHA is refused by GitHub for reusable workflows anyway.
#   - a trailing comment naming what that commit is. The preferred form is `# X.Y.Z`, the tag the
#     commit carries: Dependabot advances it. `# main YYYY-MM-DD` (the date of the main commit
#     pinned) exists only for a publisher with no tags. Dependabot cannot advance such a pin, so it
#     is transitional: a repository on this form is waiting on its publisher to tag, and moves to
#     `# X.Y.Z` when it does. krateo-platformops/.github tagged 1.0.0 on 2026-11-18 (charts#23), so
#     the preferred form for it is now `# 1.0.0`. A dated pin into it still passes, but is printed as
#     a notice and counted in the summary. Resolve an annotated tag with `^{}` when pinning and when
#     reviewing a pin: refs/tags/X.Y.Z is the tag object, not the commit, and comparing a correct pin
#     against it shows a false mismatch. Without a comment nobody can tell what is pinned or whether
#     it is stale.
# Inside a shared reusable (a file with `on: workflow_call`) the same holds for what it calls, and a float is refused
# there: a caller that pins the reusable freezes only the reusable's own text, so a `@main` inside it would still move
# under every pinned caller (found by the github-provider-kog and azuredevops-provider-kog sessions, 2026-11-18).
# The one exception is a deliberate float, recorded at the line where it happens:
#     uses: owner/repo/.github/workflows/x.yaml@main # floating: YYYY-MM-DD <reason>
# It is a first-class form of the comment check, beside `# X.Y.Z` and `# main YYYY-MM-DD`, and is
# accepted only when every claim the check can verify holds:
#   - the date is a real calendar date, so a float's age is visible;
#   - there is a reason: inline after the date or, when the line has none, the comment block
#     immediately above the `uses:` line, inside the same job with no blank line between (for a
#     rationale too long for one line);
#   - the reusable's owner is org-owned (krateo-platformops or krateo-blueprints); another owner's
#     code is never floated;
#   - it is not the publisher (krateo-blueprints/charts publish-chart.yaml), which receives an
#     org-wide write token and stays pinned;
#   - the ref is a branch. `floating` on a 40-hex pin is refused as meaningless. A ref that looks
#     like a version (`1`, `1.1.0`, `v7`) or is 7 to 39 hex characters is read as a tag or an
#     abbreviated SHA and refused; the check makes no network call, so a branch named like either is
#     refused, not guessed at.
# Every accepted float is printed with its file, line, date and reason, and the summary line always
# counts floats next to the unpinned and the cross-org inherits, so a lazy float is visible, not
# hidden behind a green "0 not pinned".
# (Decided by Diego for nova-kog, 2026-11-07, reaffirmed 2026-11-18: org-owned workflows may float
# where a repository chooses to; the publisher may not.)
# What is not checked: local workflows (`./...`), which move with the caller's own commit;
# `docker://` images; and actions (`owner/repo@ref`, no .github/workflows/ in the path), except the
# shared chart-push action (below). Rule 9 does not cover actions (charts#20, decided 2026-11-18).
#
# Rule 14, checked here because every caller already runs this job:
#   - the shared chart-push action (`krateo-platformops/.github/.github/actions/chart-push@<ref>`,
#     owner and repository in any case) is pinned like a reusable workflow: a 40-hex commit with
#     `# X.Y.Z` (krateo-platformops/.github is tagged since 1.0.0) or the transitional dated form.
#     It is never floated: it receives the caller's registry write credentials.
#   - no workflow pushes a chart bare. Every uncommented line with `helm push` or `oras push` (as a
#     word, after the start of the line, whitespace, `;`, `&`, `|`, `(`, a backtick or a quote) is
#     refused: charts are pushed through that action, which survives GHCR's tag read-after-write
#     race (sha256:<digest>: not found after an accepted PUT).
#     A line whose first non-blank character is `#`, a YAML or shell comment, is not a push. The check
#     is textual and reads the workflow files and every *.sh, *.mk and Makefile in the checkout (1.4.1:
#     a script the workflow runs pushed bare and passed 1.4.0), and every other file whose first line is
#     a shell shebang (`^#!.*\b(ba|da|k|z)?sh\b`), extension or not (1.4.4: an extensionless
#     hack/release-preflight with a bare push passed 1.4.3). A python shebang is not shell, so a .py, or a
#     push through a variable (`$HELM push`), is not seen. The summary counts the scripts scanned. It cannot tell an `oras push` of a chart from
#     one of another artifact, so it refuses both; a non-chart `oras push` is decided in
#     PUBLISHING.md first.
#
# A repository with no workflow file at all fails: a check that read nothing has checked nothing.
#
# Rule 9, the prose agrees with the pin (1.4.4). A comment that says which version a pin is must name the version
# on the pin's own `# X.Y.Z`. krateo-arubacloud-provider-kog before its #99 said "Pinned to the commit tag 1.0.2
# points at" 33 lines above a `# 1.4.2` pin; openstack-nova-operator-kog before its #197 said "adopted at charts
# 1.3.0, whose tag peels to this commit" above one. Measured over all 104 repositories before it became a check
# (Diego, 2026-11-18). How it reads a comment:
#   - scope is the YAML's structure, never a line window: a job-level `uses:` with its job block, a step-level one
#     with its step block, each with the comment run directly above it at the key's indent;
#   - only full-line comments, as sentences, and only a sentence with a pin-referring phrase: "this commit", "this
#     pin", "pinned here" and "verified here" bind the sentence, a bare "pinned to" or "points at" only its clause;
#     a phrase inside "..." or `...` is a mention and is not read;
#   - only versions of the pinned thing: an X.Y.Z that is a tag of the pinned repository, from `git ls-remote
#     --tags` (once per repository per run); a sentence naming another pin of the file, and not this one, is
#     that pin's;
#   - it disagrees when the bound text names such versions and none is the pin's. History naming the current pin
#     agrees ("1.0.1 lost a race, 1.0.3 <- pinned here" over `# 1.0.3`);
#   - a version belongs to the repository named explicitly nearest it in its sentence, else last before it in its
#     paragraph, else the pinned one. Named explicitly means a github.com/owner/repo URL, or owner/repo for one of
#     the two orgs or an owner this file pins from (not a file name). A deictic sentence that gives the pin another
#     repository's version disagrees by referent: charts "1.0.3 <- pinned here" over a krateo-platformops/.github
#     `# 1.0.3`, or charts 1.0.0 over its `# 1.0.0`, though the numbers match (the openstack-nova-operator-kog
#     session). A bare word ("charts", "platformops") is not a name: it is a common noun as often as a repository.
# The FAIL line names the comment line, the pin's line and version, the scope and its lines, and the listing's
# count: distinct tags, and how many are annotated (the `^{}` rows), not the raw row count. An empty or failed
# listing is a failed measurement: exit 2, never a pass, never a skip.
# Known limits: inline (end-of-line) comments are not read; a pin whose comment holds no version (`# main
# YYYY-MM-DD`, `# floating: ...`) is not compared; action.yml files are not read; another product's version that
# equals a tag of the pinned repository is compared as though it were the pin's unless the sentence or paragraph
# names that product's repository explicitly; and a repository named only by a bare word is not attributed.
#
# Also checked, on the same `uses:`: no `secrets: inherit` when the reusable's owner is not the
# caller's owner. `inherit` passes nothing to a reusable in another organisation, and nothing says so:
# the called workflow reads every secret as '' and decides for itself what that means.
# krateo-platformops/.github's release-notes.yaml reads it as "no credential is set for this org",
# skips every step and reports success. openstack-keystone-operator-kog shipped 0.4.1 and 0.4.2 that
# way (release-notes runs 43481711323 and 44232413718) while the org secret was set, until its caller
# passed the secrets by name (openstack-keystone-operator-kog#33, krateo-platformops/.github#57). Only
# the uncommented key counts: callers that were fixed explain the fix in a comment that quotes
# `secrets: inherit`, and a text search counted all 44 krateo-blueprints callers of release-notes.yaml
# as inheriting when one did. The caller's owner comes from github.repository; if it is empty the
# check fails rather than skipping.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "directory, relative to the repository root, whose .github/workflows/ is checked (default: the root)"
        type: string
        required: false
        default: "."

jobs:
  pinned-uses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The directory reaches the script through env, never interpolated into it.
      - name: Every reusable workflow and shared action is pinned by commit SHA with a version comment, no cross-org secrets inherit, no bare chart push
        env:
          WORKDIR: ${{ inputs.working-directory }}
          CALLER: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "${WORKDIR}"
          python3 -I - <<'PY'
          import datetime
          import glob
          import os
          import re
          import subprocess
          import sys

          files = sorted(glob.glob(".github/workflows/*.yaml") + glob.glob(".github/workflows/*.yml"))
          if not files:
              print("::error::no .github/workflows/*.yaml or *.yml here, so nothing was checked")
              sys.exit(1)
          caller_owner = os.environ.get("CALLER", "").partition("/")[0].lower()
          if not caller_owner:
              print("::error::CALLER (github.repository) is empty, so a cross-org `secrets: inherit` could not be told from a same-org one")
              sys.exit(1)
          USES = re.compile(r"""^\s*(?:-\s+)?uses:\s*(['"]?)([^'"\s#]+)\1\s*(?:#\s*(.*?))?\s*$""")
          # The key itself, never a comment that quotes it: a line whose first non-blank is `#` cannot match.
          INHERIT = re.compile(r"""^(\s*)secrets:\s*(['"]?)inherit\2\s*(?:#.*)?$""")
          # A bare chart push (rule 14): `helm push` / `oras push` as a word, not part of another word.
          # `@` too: a Makefile recipe line may start with it (`@helm push ...`).
          PUSH = re.compile(r"""(^|[\s;&|(`'"@])(helm|oras)\s+push\b""")
          CHART_PUSH_ACTION = "krateo-platformops/.github/.github/actions/chart-push"


          def indent(line):
              return len(line) - len(line.lstrip(" "))


          def significant(line):
              t = line.strip()
              return t != "" and not t.startswith("#")


          def job_siblings(lines, i):
              # The other keys of the job whose `uses:` is lines[i]: lines at the same column, inside the
              # run of significant lines indented at least that far around it.
              col = indent(lines[i])
              lo = i
              while lo > 0 and (not significant(lines[lo - 1]) or indent(lines[lo - 1]) >= col):
                  lo -= 1
              hi = i
              while hi + 1 < len(lines) and (not significant(lines[hi + 1]) or indent(lines[hi + 1]) >= col):
                  hi += 1
              return [k for k in range(lo, hi + 1) if k != i and significant(lines[k]) and indent(lines[k]) == col]

          def real_date(text):
              if not DATE.match(text):
                  return False
              try:
                  datetime.date.fromisoformat(text)
              except ValueError:
                  return False
              return True


          def reason_above(lines, i):
              # The comment block immediately above lines[i], in the same job: contiguous comment lines,
              # no blank line between, indented at least as far as the `uses:` key.
              col = indent(lines[i])
              texts = []
              k = i - 1
              while k >= 0 and lines[k].strip().startswith("#") and indent(lines[k]) >= col:
                  texts.append(lines[k].strip().lstrip("#").strip())
                  k -= 1
              return " ".join(t for t in reversed(texts) if t)

          SHA = re.compile(r"^[0-9a-f]{40}$")
          COMMENT = re.compile(r"^(\d+\.\d+\.\d+|main \d{4}-\d{2}-\d{2})$")
          # `floating:`, then the date token, then an optional inline reason.
          FLOATING = re.compile(r"^floating:\s*(\S*)\s*(.*)$")
          DATE = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          FLOAT_OWNERS = ("krateo-platformops", "krateo-blueprints")
          TAGLIKE = re.compile(r"^v?\d+(\.\d+)*([-+][0-9A-Za-z.-]+)?$")
          SHORT_SHA = re.compile(r"^[0-9a-f]{7,39}$")
          PUBLISHER = "krateo-blueprints/charts/.github/workflows/publish-chart.yaml"
          bad, inherits, floats, pushes, checked, actions = [], [], [], [], 0, 0
          dated_tagged = []
          # Owners that publish tags now: a `# main YYYY-MM-DD` pin into them is still accepted (transitional) but gets a
          # notice to move to `# X.Y.Z` at the same commit. krateo-platformops/.github tagged 1.0.0 on 2026-11-18 (charts#23).
          TAGGED_OWNERS = ("krateo-platformops/.github/",)


          def bare_push(line):
              # A `helm push` / `oras push` run by this line, or None (PUBLISHING.md rule 14).
              m = PUSH.search(line)
              # BEGIN push-comment (a YAML or shell comment line is not a push)
              if line.lstrip().startswith("#"):
                  return None
              # END push-comment
              return m


          for path in files:
              lines = open(path, encoding="utf-8").read().split("\n")
              # A reusable workflow (on: workflow_call): a caller that pins it freezes only its text, so what it calls
              # must be pinned too (PUBLISHING.md rule 9, inside shared reusables).
              reusable = any(re.match(r"^\s*workflow_call\s*:", l) for l in lines)
              for n, line in enumerate(lines, 1):
                  # BEGIN bare-push (test/pinned-uses/run-cases.py deletes this block to prove its cases see it)
                  bp = bare_push(line)
                  if bp:
                      pushes.append("%s:%d: a bare `%s push`; push charts through %s@<40-hex sha> # X.Y.Z, which survives GHCR's tag read-after-write race (PUBLISHING.md rule 14)" % (path, n, bp.group(2), CHART_PUSH_ACTION))
                  # END bare-push
                  m = USES.match(line)
                  if not m:
                      continue
                  target, comment = m.group(2), (m.group(3) or "").strip()
                  is_action = False
                  # BEGIN action-scope (the shared chart-push action is checked, though other actions are not)
                  is_action = target.split("@", 1)[0].lower() == CHART_PUSH_ACTION
                  # END action-scope
                  if target.startswith(("./", "docker://")) or ("/.github/workflows/" not in target and not is_action):
                      continue
                  ref = target.rpartition("@")[2] if "@" in target else ""
                  where = "%s:%d: %s" % (path, n, target)
                  if is_action:
                      actions += 1
                      # BEGIN action-sha
                      if not SHA.match(ref):
                          bad.append("%s is pinned to %r, not a 40-hex commit SHA; the shared chart-push action is always pinned by commit and never floated (PUBLISHING.md rule 14)" % (where, ref))
                          continue
                      # END action-sha
                      # BEGIN action-comment
                      if not COMMENT.match(comment):
                          bad.append("%s has comment %r; the shared chart-push action needs `# X.Y.Z` (krateo-platformops/.github is tagged since 1.0.0), or the transitional `# main YYYY-MM-DD`, and is never floated (PUBLISHING.md rule 14)" % (where, comment))
                      # END action-comment
                      if comment.startswith("main ") and target.lower().startswith(TAGGED_OWNERS):
                          dated_tagged.append(where)
                      continue
                  checked += 1
                  owner = target.split("/", 1)[0].lower()
                  # BEGIN inherit-check (test/pinned-uses/run-cases.py deletes this block to prove its cases see it)
                  if owner != caller_owner:
                      for k in job_siblings(lines, n - 1):
                          if INHERIT.match(lines[k]):
                              inherits.append("%s:%d: `secrets: inherit` for %s, a reusable owned by %s, not %s: inherit passes nothing across organisations, so pass each secret by name under `secrets:`" % (path, k + 1, target, owner, caller_owner))
                  # END inherit-check
                  float_form = FLOATING.match(comment)
                  # BEGIN comment-check
                  if not (COMMENT.match(comment)
                          # BEGIN float-form (the float is a first-class comment form; without it a valid float is a format error)
                          or float_form
                          # END float-form
                          ):
                      bad.append("%s has comment %r; it needs `# X.Y.Z`, or `# main YYYY-MM-DD` for an untagged repository (transitional), or a recorded float `# floating: YYYY-MM-DD <reason>`" % (where, comment))
                      continue
                  # END comment-check
                  # BEGIN float-accept (deleting it must turn the accepted floats into refusals)
                  if float_form:
                      date, reason = float_form.group(1), float_form.group(2).strip()
                      # BEGIN float-date
                      if not real_date(date):
                          bad.append("%s floats with %r where the date belongs; write `# floating: YYYY-MM-DD <reason>` with a real date" % (where, date))
                          continue
                      # END float-date
                      if not reason:
                          reason = reason_above(lines, n - 1)
                      # BEGIN float-reason
                      if not reason:
                          bad.append("%s floats with no reason: none after the date, and no comment block immediately above the `uses:` line" % where)
                          continue
                      # END float-reason
                      # BEGIN float-owner
                      if owner not in FLOAT_OWNERS:
                          bad.append("%s floats a reusable owned by %s; only org-owned reusables (%s) may float" % (where, owner, ", ".join(FLOAT_OWNERS)))
                          continue
                      # END float-owner
                      # BEGIN float-publisher
                      if target.rpartition("@")[0].lower() == PUBLISHER:
                          bad.append("%s floats the publisher, which receives an org-wide write token and is always pinned by commit SHA (PUBLISHING.md rule 9)" % where)
                          continue
                      # END float-publisher
                      # BEGIN float-sha
                      if SHA.match(ref):
                          bad.append("%s is pinned to a commit and also says `# floating`, which is meaningless; keep the pin and use `# X.Y.Z` or `# main YYYY-MM-DD`" % where)
                          continue
                      # END float-sha
                      # BEGIN float-branch
                      if not ref or TAGLIKE.match(ref) or SHORT_SHA.match(ref):
                          bad.append("%s floats %r, which reads as a tag or an abbreviated SHA, not a branch; only a branch ref can be a recorded float" % (where, ref))
                          continue
                      # END float-branch
                      # BEGIN float-reusable
                      if reusable:
                          bad.append("%s floats inside a reusable workflow (on: workflow_call); a caller that pins this file would still run whatever %s's branch holds, so pin it by commit (PUBLISHING.md rule 9, inside shared reusables)" % (where, ref))
                          continue
                      # END float-reusable
                      floats.append((where, date, reason))
                      continue
                  # END float-accept
                  if comment.startswith("main ") and target.lower().startswith(TAGGED_OWNERS):
                      dated_tagged.append(where)
                  # BEGIN sha-check (test/pinned-uses/run-cases.py deletes this block to prove its cases see it)
                  if not SHA.match(ref):
                      bad.append("%s is pinned to %r, not a 40-hex commit SHA (a deliberate float of a branch says `# floating: YYYY-MM-DD <reason>`)" % (where, ref))
                  # END sha-check
          # Rule 14 in scripts too: a bare push inside a script a workflow runs is the same push. Every *.sh, *.mk
          # and Makefile in the checkout is read, comment lines skipped; a heredoc line is judged live, since it runs (krateo-openstack-blueprint's hack/publish-charts.sh, 2026-11-18,
          # passed 1.4.0 by being outside .github/workflows).
          scripts = []
          # Any file whose first line is a shell shebang is a script too, extension or not (1.4.4: the
          # openstack-ironic-operator-kog session planted a bare push in its extensionless hack/release-preflight
          # and 1.4.3 scanned past it). A python shebang is not a shell one.
          SHELL_SHEBANG = re.compile(r"^#!.*\b(ba|da|k|z)?sh\b")
          for d, ds, fs in os.walk("."):
              ds[:] = sorted(x for x in ds if x not in (".git", "node_modules"))
              # Where a push actually executes: shell scripts and Makefiles. A .py is not read: a line filter would
              # count docstring prose as code (the nova-kog session), and no repository runs helm from Python today.
              for f in fs:
                  path = os.path.normpath(os.path.join(d, f))
                  if f.endswith((".sh", ".mk")) or f in ("Makefile", "makefile", "GNUmakefile"):
                      scripts.append(path)
                      continue
                  # BEGIN shebang-select (a shell script needs no extension: hack/release-preflight, rule 12's own hook)
                  try:
                      with open(path, "rb") as fh:
                          first = fh.readline(256).decode("utf-8", "replace")
                  except OSError:
                      continue
                  if SHELL_SHEBANG.match(first):
                      scripts.append(path)
                  # END shebang-select
          scripts.sort()
          # BEGIN script-scan (test/pinned-uses/run-cases.py deletes this block to prove its cases see it)
          for path in scripts:
              try:
                  text = open(path, encoding="utf-8").read()
              except (UnicodeDecodeError, OSError):
                  continue
              for n, line in enumerate(text.split("\n"), 1):
                  bp = bare_push(line)
                  if bp:
                      pushes.append("%s:%d: a bare `%s push` in a script; run it through %s (locate mode: `bash \"${CHART_PUSH}\" <tgz> <oci repo>` with CHART_PUSH from the action's path output), which survives GHCR's tag read-after-write race (PUBLISHING.md rule 14)" % (path, n, bp.group(2), CHART_PUSH_ACTION))
          # END script-scan
          # Rule 9, the prose agrees with the pin (1.4.4). A comment that says which version a pin is ("pinned to the
          # commit tag 1.0.2 points at", "whose tag peels to this commit") must name the version on the pin's own
          # `# X.Y.Z`. Measured over all 104 repositories on 2026-11-18 before it became a check: krateo-arubacloud-provider-kog
          # before its #99 and openstack-nova-operator-kog before its #197 said so of an older version, 33 and 9 lines above.
          #   - Scope is structural, never a line window: a job-level `uses:` (a reusable workflow call) is read with its job
          #     block, a step-level one with its step block. A block is its key line or `-` item through the line before its
          #     next sibling, plus the comment run directly above it at the key's own indent.
          #   - Only full-line comments are read, joined into sentences (an empty `#` line ends a paragraph).
          #   - Only a sentence holding a pin-referring phrase is read. "this commit", "this pin", "pinned here" and
          #     "verified here" bind the whole sentence, unless a past-tense verb follows the phrase ("This pin sat at
          #     1.0.4 while ...": history, not a claim about the pin now); a bare "pinned to" or "points at" binds only
          #     its own clause (no `, ; : ( ) --` between). A phrase inside "..." or `...` is a mention, not a use.
          #   - Only versions OF THE PINNED THING are compared: an X.Y.Z (optional `v`, no leading zero) that is a tag of
          #     the pinned repository, listed with `git ls-remote --tags` (once per repository per run). The repository's
          #     own chart version, or another product's release, is not this pin's. A sentence that names another pin of
          #     the same file and not this one is left to that pin.
          #   - A version belongs to the repository named explicitly nearest it in its sentence, else last before it in its
          #     paragraph, else the pinned one (a github.com URL, or owner/repo for the two orgs or an owner this file
          #     pins from; not a file name, not a bare word). A deictic sentence giving the pin another repository's
          #     version disagrees by referent, even when the numbers match (charts 1.0.0 over platformops `# 1.0.0`).
          #   - A bound text disagrees when it names versions of the pinned thing and none is the pin's (a major-only pin,
          #     `# v5`, agrees with any v5.x.y). History that names the current pin agrees: "1.0.1 lost a race, 1.0.3 <-
          #     pinned here" over `# 1.0.3`.
          #   - The tag listing is a measurement: an empty or failed one is an error (exit 2), never a pass and never a
          #     skip. Its count is the number of distinct tags, not counting the `^{}` rows of annotated tags.
          # Known limits: inline (end-of-line) comments are not read; a pin whose comment holds no version (`# main
          # YYYY-MM-DD`, `# floating: ...`) is not compared; action.yml files are not read (only .github/workflows);
          # another product's version that equals a tag of the pinned repository is compared as if it were the pin's,
          # unless its repository is named explicitly; and a repository named only by a bare word is not attributed.
          AGREE_PIN = re.compile(r"""^(\s*)(-\s+)?uses:\s*['"]?([^'"\s#@]+)@([0-9a-f]{40})['"]?\s*(?:#\s*(.*))?$""")
          AGREE_TOKEN = re.compile(r"(?<![\w.])v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?![\w])(?!\.[0-9])")
          AGREE_PIN_VERSION = re.compile(r"^v?([0-9]+(?:\.[0-9]+){0,2})\b")
          AGREE_PHRASE = re.compile(r"this commit|this pin|pinned here|pinned to|verified here|points at", re.I)
          AGREE_DEICTIC = re.compile(r"this commit|this pin|pinned here|verified here", re.I)
          AGREE_PAST = re.compile(r"\s+(?:was|were|had|sat|stood|went|held|used to|[a-z]{2,}ed)\b", re.I)
          AGREE_CLAUSE = re.compile(r"[,;:()]|--|—")
          AGREE_QUOTED = re.compile(r'"[^"]*"|`[^`]*`|“[^”]*”')
          AGREE_KEY = re.compile(r"^(\s*)([A-Za-z0-9_.-]+):(\s|$)")
          AGREE_ITEM = re.compile(r"^(\s*)-(\s|$)")
          # An explicit repository: a github.com URL, or owner/repo for an owner this file pins from or one of the two orgs.
          AGREE_REPO = re.compile(r"github\.com/([A-Za-z0-9-]+)/(\.?[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*)|(?<![\w./-])([A-Za-z0-9-]+)/(\.?[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*)")
          # A file name is not a repository (krateo-blueprints/index.yaml).
          AGREE_FILE = re.compile(r"\.(ya?ml|md|json|txt|py|sh|tgz|git)$", re.I)
          tag_listings = {}
          disagreements, measurement_errors = [], []


          def agree_comment(l):
              return l.lstrip().startswith("#")


          def agree_blank(l):
              return not l.strip()


          def block_end(lines, start, ind, item):
              # The last line of the block that starts at lines[start] (a key, or a `-` item, at indent ind).
              last = start
              for i in range(start + 1, len(lines)):
                  l = lines[i]
                  if agree_blank(l) or agree_comment(l):
                      continue
                  if indent(l) <= ind:
                      break
                  last = i
              j = last + 1
              while j < len(lines) and agree_comment(lines[j]) and indent(lines[j]) > ind:
                  last = j
                  j += 1
              return last


          def leading(lines, start, ind):
              # The first line of the comment run directly above lines[start] that sits at the key's own indent; deeper
              # comments at the top of that run trail the previous block.
              i = start
              while i - 1 >= 0 and agree_comment(lines[i - 1]):
                  i -= 1
              run = list(range(i, start))
              k = 0
              while k < len(run) and indent(lines[run[k]]) != ind:
                  k += 1
              return run[k] if k < len(run) else start


          def pin_scopes(lines):
              # {index of a pinned `uses:` line: (kind, first, last)}, its job block or its step block.
              out = {}
              jobs_i = next((i for i, l in enumerate(lines) if re.match(r"^jobs:\s*(#.*)?$", l)), None)
              if jobs_i is None:
                  return out
              job_ind = None
              for i in range(jobs_i + 1, len(lines)):
                  l = lines[i]
                  if agree_blank(l) or agree_comment(l):
                      continue
                  if indent(l) == 0:
                      break
                  if job_ind is None:
                      job_ind = indent(l)
                  if indent(l) != job_ind or not AGREE_KEY.match(l):
                      continue
                  j_end = block_end(lines, i, job_ind, False)
                  j_first = leading(lines, i, job_ind)
                  child = next((indent(lines[x]) for x in range(i + 1, j_end + 1)
                                if not agree_blank(lines[x]) and not agree_comment(lines[x])), None)
                  for u in range(i, j_end + 1):
                      m = AGREE_PIN.match(lines[u])
                      if not m:
                          continue
                      if not m.group(2) and indent(lines[u]) == child:
                          out[u] = ("job", j_first, j_end)
                          continue
                      scope = ("job", j_first, j_end)
                      # BEGIN step-scope (a step's pin is read with its step, not its job: nova-kog's conflation, 1 -> 54 hits)
                      s = u
                      if not m.group(2):
                          s = next((x for x in range(u - 1, i, -1) if AGREE_ITEM.match(lines[x]) and indent(lines[x]) < indent(lines[u])), u)
                      scope = ("step", leading(lines, s, indent(lines[s])), block_end(lines, s, indent(lines[s]), True))
                      # END step-scope
                      out[u] = scope
              return out


          def pin_names(ref):
              # How a comment names the pinned thing: the workflow or action's basename, and the repository's name.
              base = re.sub(r"\.ya?ml$", "", ref.rstrip("/").split("/")[-1]).lower()
              repo = ref.split("/")[1].lower().lstrip(".") if ref.count("/") >= 1 else ""
              return {x for x in (base, repo) if len(x) > 2}


          def comment_sentences(block):
              # [(sentence, offset in its paragraph, [(end offset, line number)])] from (line number, text) comment lines.
              paras, cur = [], []
              for n, l in block:
                  t = l.strip()[1:].strip()
                  if not t:
                      if cur:
                          paras.append(cur)
                      cur = []
                      continue
                  cur.append((n, t))
              if cur:
                  paras.append(cur)
              out = []
              for p in paras:
                  text, owners = "", []
                  for n, t in p:
                      text += (" " if text else "") + t
                      owners.append((len(text), n))
                  for m in re.finditer(r"(?:[^.!?]|[.!?](?!\s|$))+[.!?]?", text):
                      if m.group(0).strip():
                          out.append((m.group(0), m.start(), owners, text))
              return out


          def line_at(pos, owners):
              for end, n in owners:
                  if pos < end:
                      return n
              return owners[-1][1]


          def tags_of(repo):
              # The pinned repository's distinct tags, `v` stripped, from one `git ls-remote --tags`; None after an error.
              if repo in tag_listings:
                  return tag_listings[repo]
              url = "https://github.com/%s" % repo
              try:
                  p = subprocess.run(["git", "ls-remote", "--tags", url], capture_output=True, text=True, timeout=120,
                                     env=dict(os.environ, GIT_TERMINAL_PROMPT="0"))
                  rc, rows, err = p.returncode, [l.split("\t", 1)[1] for l in p.stdout.splitlines() if "\t" in l], p.stderr.strip()
              except (OSError, subprocess.TimeoutExpired) as e:
                  rc, rows, err = -1, [], str(e)
              names = {r[len("refs/tags/"):] for r in rows if r.startswith("refs/tags/") and not r.endswith("^{}")}
              peeled = sum(1 for r in rows if r.endswith("^{}"))
              # BEGIN listing-control (an empty or failed listing is a failed measurement, never a pass)
              if rc != 0 or not names:
                  measurement_errors.append("`git ls-remote --tags %s` %s, so whether a comment names a tag of %s is not known; this is a failed measurement, not a pass (exit 2)" % (url, "exited %d: %s" % (rc, err[:200]) if rc != 0 else "listed no tags", repo))
                  tag_listings[repo] = None
                  return None
              # END listing-control
              tag_listings[repo] = ({x[1:] if x.startswith("v") else x for x in names}, len(names), peeled)
              return tag_listings[repo]


          def repo_mentions(text, known):
              # [(offset, "owner/repo")] for each explicit repository named in text.
              out = []
              for m in AGREE_REPO.finditer(text):
                  url = m.group(1) is not None
                  owner, name = (m.group(1), m.group(2)) if url else (m.group(3), m.group(4))
                  if name.lower().endswith(".git"):
                      name = name[:-4]
                  if AGREE_FILE.search(name):
                      continue
                  if url or owner.lower() in known:
                      out.append((m.start(), "%s/%s" % (owner, name)))
              return out


          def pin_agrees(tok, pin):
              tok = tok[1:] if tok.startswith("v") else tok
              return tok == pin or (pin.count(".") < 2 and tok.startswith(pin + "."))


          # BEGIN agreement-check (test/pinned-uses/run-cases.py deletes this block to prove its cases see it)
          for path in files:
              lines = open(path, encoding="utf-8").read().split("\n")
              scopes = pin_scopes(lines)
              pins = {u: AGREE_PIN.match(lines[u]) for u in scopes}
              for u, (kind, first, last) in sorted(scopes.items()):
                  m = pins[u]
                  ref, pin_comment = m.group(3), (m.group(5) or "").strip()
                  pv = AGREE_PIN_VERSION.match(pin_comment)
                  if not pv:
                      continue
                  pin = pv.group(1)
                  repo = "/".join(ref.split("/")[:2])
                  mine = pin_names(ref)
                  others = set()
                  for v, mm in pins.items():
                      if v != u and mm.group(3) != ref:
                          others |= pin_names(mm.group(3)) - mine
                  block = [(k + 1, lines[k]) for k in range(first, last + 1) if agree_comment(lines[k])]
                  known = {"krateo-blueprints", "krateo-platformops"} | {mm.group(3).split("/")[0].lower() for mm in pins.values()}
                  seen = set()
                  for sent, start, owners, para in comment_sentences(block):
                      low = sent.lower()
                      # BEGIN other-pin (a sentence about another pin of this file is that pin's)
                      if others and any(o in low for o in others) and not any(x in low for x in mine):
                          continue
                      # END other-pin
                      toks = [(t.start(), t.end(), t.group(0)) for t in AGREE_TOKEN.finditer(sent)]
                      if not toks:
                          continue
                      unquoted = sent
                      # BEGIN quote-mention (a phrase in "..." or `...` is mentioned, not used: nova-kog #201 quotes its old defect)
                      unquoted = AGREE_QUOTED.sub(lambda q: " " * len(q.group(0)), sent)
                      # END quote-mention
                      regions = [(0, len(sent), False)]
                      # BEGIN phrase-required (only a sentence that refers to the pin is read; history and fixtures are not)
                      regions = []
                      for pm in AGREE_PHRASE.finditer(unquoted):
                          if AGREE_DEICTIC.match(pm.group(0)):
                              # BEGIN deictic-history (a deictic phrase followed by a past-tense verb is history: "This pin sat
                              # at 1.0.4 while ..." in openstack-ironic-operator-kog, whose pin has since moved to 1.4.3)
                              if AGREE_PAST.match(unquoted, pm.end()):
                                  continue
                              # END deictic-history
                              regions.append((0, len(sent), True))
                          else:
                              lo = max([0] + [c.end() for c in AGREE_CLAUSE.finditer(unquoted, 0, pm.start())])
                              nxt = AGREE_CLAUSE.search(unquoted, pm.end())
                              regions.append((lo, nxt.start() if nxt else len(sent), False))
                      # END phrase-required
                      sent_mentions = repo_mentions(sent, known)
                      para_mentions = repo_mentions(para, known)

                      def referent(t):
                          # The repository a version belongs to: the one named nearest it in its sentence, else the last
                          # one named before it in its paragraph (a table under a heading that names it), else the
                          # pinned one. Never the whole block: a block's opening line about another repository does
                          # not own a later sentence.
                          if sent_mentions:
                              return min(sent_mentions, key=lambda m: min(abs(m[0] - t[0]), abs(m[0] - t[1])))[1]
                          prior = [r for q, r in para_mentions if q < start + t[0]]
                          return prior[-1] if prior else repo

                      for lo, hi, deictic in regions:
                          inside = [t for t in toks if t[0] >= lo and t[1] <= hi]
                          if not inside:
                              continue
                          ref_of = {t: repo for t in inside}
                          # BEGIN referent (a version is attributed to the repository named before it: charts 1.0.0 is not
                          # platformops 1.0.0, though the numbers match; found by the openstack-nova-operator-kog session)
                          ref_of = {t: referent(t) for t in inside}
                          for t in inside:
                              if not deictic or ref_of[t].lower() == repo.lower():
                                  continue
                              other = tags_of(ref_of[t])
                              if other is None or (t[2][1:] if t[2].startswith("v") else t[2]) not in other[0]:
                                  continue
                              n = line_at(start + t[0], owners)
                              if (n, t[2], ref_of[t]) in seen:
                                  continue
                              seen.add((n, t[2], ref_of[t]))
                              excerpt = sent.strip()
                              disagreements.append("%s:%d: names %s of %s, but the pin at %s:%d is %s `# %s`, another repository (%s scope, lines %d-%d; %d distinct tags of %s listed, %d of them annotated): \"%s\"" % (
                                  path, n, t[2], ref_of[t], path, u + 1, repo, pin_comment, kind, first + 1, last + 1, other[1], ref_of[t], other[2],
                                  excerpt if len(excerpt) <= 240 else excerpt[:237] + "..."))
                          # END referent
                          inside = [t for t in inside if ref_of[t].lower() == repo.lower()]
                          if not inside:
                              continue
                          listing = tags_of(repo)
                          if listing is None:
                              continue
                          # BEGIN tag-filter (only versions of the pinned thing: nova-kog's own chart version 0.1.9 is not one)
                          inside = [t for t in inside if (t[2][1:] if t[2].startswith("v") else t[2]) in listing[0]]
                          # END tag-filter
                          if not inside or any(pin_agrees(t[2], pin) for t in inside):
                              continue
                          for a, b, tok in inside:
                              n = line_at(start + a, owners)
                              if (n, tok) in seen:
                                  continue
                              seen.add((n, tok))
                              excerpt = sent.strip()
                              disagreements.append("%s:%d: names %s of %s, but the pin at %s:%d is `# %s` (%s scope, lines %d-%d; %d distinct tags of %s listed, %d of them annotated): \"%s\"" % (
                                  path, n, tok, repo, path, u + 1, pin_comment, kind, first + 1, last + 1, listing[1], repo, listing[2],
                                  excerpt if len(excerpt) <= 240 else excerpt[:237] + "..."))
          # END agreement-check
          for where in dated_tagged:
              print("::notice title=dated pin into a tagged repository::%s is pinned with `# main YYYY-MM-DD`. That form is for a publisher with no tags; Dependabot cannot advance such a pin, so it is transitional, and a repository on it is waiting on its publisher to tag. krateo-platformops/.github is tagged from 1.0.0 (charts#23), so pin `# 1.0.0` (or a later `# X.Y.Z`); resolve the tag with `^{}` (git ls-remote <repo> 'refs/tags/X.Y.Z^{}') when pinning and when reviewing, since refs/tags/X.Y.Z is the annotated tag object, not the commit" % where)
          for where, date, reason in floats:
              print("::notice title=floating reusable workflow::%s floats since %s, reason: %s" % (where, date, reason))
          for b in bad + inherits + pushes:
              print("::error::" + b)
          for b in disagreements:
              print("::error title=pin comment disagrees with the pin::" + b)
          for b in measurement_errors:
              print("::error title=failed measurement::" + b)
          listed = {r: v for r, v in tag_listings.items() if v is not None}
          print("%d file(s), %d reusable-workflow uses, %d not pinned (PUBLISHING.md rule 9), %d floating, %d cross-org secrets inherit, %d shared-action uses, %d bare chart push(es) (PUBLISHING.md rule 14), %d script(s) scanned, %d dated pin(s) into a tagged repository, %d pin comment(s) disagreeing with the pin, %d tag listing(s) (%s), %d failed" % (len(files), checked, len(bad), len(floats), len(inherits), actions, len(pushes), len(scripts), len(dated_tagged), len(disagreements), len(listed), ", ".join("%s: %d distinct tags, %d annotated" % (r, v[1], v[2]) for r, v in sorted(listed.items())) or "none needed", len(measurement_errors)))
          sys.exit(2 if measurement_errors else 1 if bad or inherits or pushes or disagreements else 0)
          PY
